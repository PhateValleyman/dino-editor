name: Android build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Check out the repository source.
      - name: Checkout
        uses: actions/checkout@v4

      # Install the JDK required by Android Gradle Plugin 8.5.2.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Configure the Android SDK used by compileSdk 34.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Build the debug APK and run Android lint checks.
      - name: Build and lint
        run: ./gradlew assembleDebug lintDebug --stacktrace

      # Publish the debug APK as a workflow artifact.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dino-editor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
